{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block page %}register{% endblock %}
{% block content %}
<section class="auth">
  <h1>Create your account</h1>
  <form id="auth-form" novalidate>
    <label>Full name<input name="name" autocomplete="name" required maxlength="100"></label>
    <label>Email<input name="email" type="email" autocomplete="email" required></label>
    <label>Phone number<input name="phone" type="tel" autocomplete="tel" inputmode="numeric" required placeholder="10 digits"></label>
    <label>Password<input name="password" type="password" autocomplete="new-password" required minlength="8">
      <small class="muted">At least 8 characters.</small></label>
    <p class="form-error" id="form-error" role="alert"></p>
    <button class="btn btn-solid btn-wide" type="submit">Create account</button>
  </form>
  <p class="muted">Already have an account? <a href="/login">Log in</a></p>
</section>
{% endblock %}
